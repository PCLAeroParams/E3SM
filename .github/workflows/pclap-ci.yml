name: pclap-ci

# CI for the PCLAeroParams fork of E3SM. This file is fork-only, so upstream syncs never touch it.
#
# EAM tests on GitHub-hosted runners, inside the E3SM container image
# (github.com/E3SM-Project/containers) with its own CIME machine, e3sm-container. Adapted from
# upstream's e3sm-gh-testing.yml, which this fork disables in the Actions UI because it tests
# upstream configurations and blesses baselines from master.
#
# Jobs:
# - eam:        EAM built without PartMC (catches PartMC code leaking into the default build).
# - eam-partmc: PartMC built from PCLAeroParams/partmc at PARTMC_REF inside the container, then
#               EAM built with -partmc (the urban_plume testmod) and run for a few steps.
#               PartMC is built without MOSAIC (not public) and without its own MPI, so the
#               machine sets PARTMC_PATH only (see components/cmake/build_model.cmake).
#
# No baselines yet: a test passes if it builds and runs. Inputdata is kept in this repo's
# Actions cache, one entry per test, saved only from runs on the default branch (entries saved
# there are visible to every PR).

on:
  # All PRs, whatever their base, so that stacked PRs are tested too
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!components/*/docs/**'
      - '!components/*/mkdocs.yml'
      - '!.github/**'
      - '.github/workflows/pclap-ci.yml'
  push:
    branches: [pclap-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PartMC commit to build (branch oscar/e3sm of PCLAeroParams/partmc)
  PARTMC_REF: 1a7b83c1b6802799490cd1c5b40a4b1ea1fed7aa

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eam
            test: SMS_Ln5.ne4pg2_oQU480.F2010
            partmc: false
          - name: eam-partmc
            # The testmod eam-partmc-urban_plume is testmods_dirs/eam/partmc/urban_plume
            test: SMS_Ln5.ne4pg2_oQU480.F2010.eam-partmc-urban_plume
            partmc: true
    name: ${{ matrix.name }}
    env:
      IMAGE: ghcr.io/e3sm-project/e3sm-image:gnu13-openmpi4
      COMPILER: gnu
      TEST: ${{ matrix.test }}
      PARTMC: ${{ matrix.partmc }}
      INPUTDATA_KEY: pclap-ci-inputdata-${{ matrix.name }}
    steps:
      # Hosted runners start with ~20 GB free; the image, E3SM with submodules, inputdata
      # and a case build need more. These are preinstalled SDKs nothing here uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: E3SM
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Check out PartMC
        if: matrix.partmc
        uses: actions/checkout@v7
        with:
          repository: PCLAeroParams/partmc
          ref: ${{ env.PARTMC_REF }}
          path: partmc
          persist-credentials: false
          show-progress: false
      - name: Restore inputdata
        id: inputdata
        uses: actions/cache/restore@v6
        with:
          path: inputdata
          key: ${{ env.INPUTDATA_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.INPUTDATA_KEY }}-
      - name: Pull the image
        run: docker pull "$IMAGE"
      # As the image's default user (uid 1000), with the image's own CIME machine, which
      # enable.sh opts into. The runner's own uid is 1001, so hand it what the test writes to,
      # and take it back after for the cache and the log upload.
      - name: Run the test
        id: run-test
        run: |
          mkdir -p inputdata scratch partmc
          find inputdata -type f | wc -l > inputdata.count
          sudo chown -R 1000:1000 E3SM inputdata scratch partmc
          # The machine and compiler go in the test name (TEST.GRID.COMPSET.MACHINE_COMPILER[.TESTMODS])
          export TESTS=$(awk -F. -v OFS=. -v m="e3sm-container_$COMPILER" '{ $3 = $3 "." m } 1' <<< "$TEST")
          rc=0
          docker run --rm -e TESTS -e COMPILER -e PARTMC \
            -v "$PWD/E3SM:/projects/e3sm/work/E3SM" \
            -v "$PWD/partmc:/projects/e3sm/work/partmc" \
            -v "$PWD/inputdata:/projects/e3sm/data/inputdata" \
            -v "$PWD/scratch:/home/e3sm/e3sm_scratch" \
            "$IMAGE" bash -lc 'set -e
              . /projects/e3sm/cime/enable.sh
              if [ "$PARTMC" = true ]; then
                # Only the library (libpartmc.a and its .mod files, in the build directory);
                # E3SM links netCDF itself, so only netcdf.mod has to be found here
                inc=$(nf-config --includedir 2>/dev/null || true)
                if [ -z "$inc" ]; then
                  inc=$(dirname "$(find / -name netcdf.mod -path "*include*" 2>/dev/null | head -n1)")
                fi
                echo "netcdf.mod in: $inc"
                cmake -S /projects/e3sm/work/partmc -B /projects/e3sm/work/partmc/build \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_C_COMPILER=gcc \
                  -DNETCDF_INCLUDE_DIR="$inc"
                cmake --build /projects/e3sm/work/partmc/build --target partmclib -j "$(nproc)"
                macros=~/.cime/e3sm-container_$COMPILER.cmake
                if [ ! -f "$macros" ]; then
                  echo "expected the machine cmake file at $macros"; exit 1
                fi
                echo "set(PARTMC_PATH \"/projects/e3sm/work/partmc/build\")" >> "$macros"
              fi
              cd /projects/e3sm/work/E3SM/cime/scripts
              ./create_test $TESTS --wait --test-id gh --parallel-jobs "$(nproc)"' || rc=$?
          sudo chown -R "$(id -u):$(id -g)" E3SM inputdata scratch partmc
          if [ "$(find inputdata -type f | wc -l)" -gt "$(cat inputdata.count)" ]; then
            echo "new_inputdata=true" >> "$GITHUB_OUTPUT"
          fi
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          {
            echo "### ${{ matrix.name }}: \`$TESTS\`"
            echo
            echo "Image \`$image\`$( [ "$PARTMC" = true ] && echo ", PartMC \`$PARTMC_REF\`")"
            echo
            echo '```'
            cat scratch/*.gh/TestStatus 2>/dev/null || echo "no TestStatus"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh inputdata
          exit "$rc"
      - name: Print TestStatus.log
        if: ${{ always() && steps.run-test.outcome == 'failure' }}
        run: |
          cat scratch/*.gh/TestStatus.log || true
      - name: Save inputdata
        if: github.ref_name == github.event.repository.default_branch && steps.run-test.outputs.new_inputdata == 'true'
        uses: actions/cache/save@v6
        with:
          path: inputdata
          key: ${{ steps.inputdata.outputs.cache-primary-key }}
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs.${{ matrix.name }}
          path: |
            scratch/*.gh/TestStatus*
            scratch/*.gh/bld/*.bldlog.*
            scratch/*.gh/run/*.log.*
          retention-days: 14
